services:
  2025-autumn-city-of-chicago-housing:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/project
    environment:
      DATA_DIR: /project/data
      PYTHONPATH: /project
    shm_size: '16gb'
    # At least one of stdin_open or tty is required to make devcontainer work
    stdin_open: true
    tty: true