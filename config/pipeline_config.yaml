# Chicago Housing Analysis Pipeline Configuration

name: "Chicago Housing Analysis"
description: "Analyze rental prices and house share prohibitions in Chicago community areas"

# Data source configurations
data:
  rental_data_path: "/project/data/Zip_zori_uc_sfrcondomfr_sm_month.csv"
  zip_boundaries_path: "/project/data/Boundaries_ZIP_Codes.csv"
  community_boundaries_path: "/project/data/Boundaries_Community_Areas.csv"
  house_share_data_path: "/project/data/aggregated_house_share_buildings_by_community.csv"

# Output configurations
output:
  output_dir: "/project/output"
  save_intermediate_results: true
  save_plots: true
  plot_format: "png"
  plot_dpi: 300
  results_format: "json"

# Analysis parameters
analysis:
  correlation_threshold: 0.1
  min_zip_codes_per_community: 1
  recent_months: 12
  spatial_join_predicate: "intersects"

# Component execution order (optional - pipeline can auto-determine)
execution_order:
  - "rental_data"
  - "zip_boundaries"
  - "community_boundaries"
  - "house_share_data"
  - "spatial_join"
  - "community_rental_processor"
  - "house_share_merger"
  - "correlation_analyzer"
  - "correlation_visualizer"
  - "summary_reporter"

# Components to include (empty list means include all registered components)
components: []

# Additional metadata
metadata:
  version: "1.0.0"
  created_by: "Chicago Housing Analysis Pipeline"
  created_date: "2025-01-27"
  tags:
    - "housing"
    - "rental_prices"
    - "house_share"
    - "chicago"
    - "spatial_analysis"
